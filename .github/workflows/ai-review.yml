name: AI Code Review
permissions:
  contents: read
  actions: read
  checks: write
  # Required by the "Comment on PR" step below: issues.createComment on a PR needs
  # pull-requests: write, otherwise the REST call fails with
  # "HttpError: Resource not accessible by integration".
  pull-requests: write


on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai diff-cover pyyaml

      - name: Run static analysis
        id: analysis
        run: |
          echo "Running CBMC verification..."
          if command -v cbmc &> /dev/null; then
            cbmc tests/verification/harness_metric.cpp --bounds-check --pointer-check --unwind 10 --32-bit || true
          fi

          echo "Running clang-tidy..."
          # clang-tidy needs a compilation database to know the include paths and
          # standard-library flags. Without one it reported every header as
          # "'string' file not found [clang-diagnostic-error]", which is pure noise
          # rather than a real finding. Generate the database first, and only then
          # analyse a sample of translation units.
          if command -v clang-tidy &> /dev/null; then
            if cmake -B build-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DQUANTUMVERSE_BUILD_TESTS=OFF > /dev/null 2>&1 \
               && [ -f build-tidy/compile_commands.json ]; then
              # Read the file list into an array so the `head` truncation cannot
              # send SIGPIPE back to find ("find: write error").
              mapfile -t TIDY_FILES < <(find src -name '*.cpp' | sort | head -5)
              if [ "${#TIDY_FILES[@]}" -gt 0 ]; then
                clang-tidy -p build-tidy "${TIDY_FILES[@]}" || true
              fi
            else
              echo "::notice::Skipping clang-tidy - no compilation database could be generated"
            fi
          fi

      - name: AI Bug Detection
        id: ai-bug-detect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import openai
          import subprocess

          openai.api_key = os.environ.get("OPENAI_API_KEY")

          pr_diff = subprocess.getoutput("git diff origin/main...HEAD --stat")
          changed_files = [f for f in pr_diff.split('\n') if f.strip() and not f.startswith(' ')]

          if not openai.api_key:
              print("::warning::OPENAI_API_KEY not set - skipping AI review")
              exit(0)

          prompt = f"""
          Review this C++17 code for bugs, performance issues, and style violations.
          Focus on: memory safety, undefined behavior, physics correctness, and GR validation.

          Changed files:
          {pr_diff[:3000]}

          Provide a brief summary of issues found.
          """

          try:
              response = openai.ChatCompletion.create(
                  model="gpt-4-turbo",
                  messages=[{"role": "user", "content": prompt}],
                  max_tokens=500
              )
              review = response.choices[0].message['content']
              print(review)
              
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(f"### AI Code Review\n\n{review}\n\n")
          except Exception as e:
              print(f"AI review failed: {e}")
              print("::warning::AI review failed")
          EOF

      # Only comment when the AI review actually produced content. Previously this
      # unconditionally echoed the whole step summary back as a PR comment, so a
      # skipped review (no OPENAI_API_KEY) still posted an empty comment.
      - name: Comment on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryPath || !fs.existsSync(summaryPath)) {
              core.info('No step summary produced - nothing to comment.');
              return;
            }
            const summary = fs.readFileSync(summaryPath, 'utf8').trim();
            if (!summary.includes('### AI Code Review')) {
              core.info('AI review was skipped or produced no findings - not commenting.');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## AI Code Review\n\n${summary}`
            });

  risk-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Analyze code churn
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)
          TOTAL_CHANGED=$(git diff --numstat origin/main...HEAD | awk '{sum += $1 + $2} END {print sum}')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "TOTAL_CHANGED=$TOTAL_CHANGED" >> $GITHUB_ENV
      
      - name: Risk classification
        run: |
          if [ "$TOTAL_CHANGED" -gt 1000 ]; then
            echo "HIGH_RISK=true" >> $GITHUB_ENV
          elif [ "$TOTAL_CHANGED" -gt 100 ]; then
            echo "MEDIUM_RISK=true" >> $GITHUB_ENV
          else
            echo "LOW_RISK=true" >> $GITHUB_ENV
          fi
          echo "Risk level: $TOTAL_CHANGED lines changed"
          
      - name: Request extra review
        if: env.HIGH_RISK == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '@${context.payload.pull_request.user.login} - This PR has high code churn. Please ensure all tests pass and consider requesting additional review.'
            });

