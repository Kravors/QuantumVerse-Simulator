name: QuantumVerse CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        id: setup_qt_linux
        with:
          version: '6.8.3'
          target: 'desktop'
          host: 'linux'
          arch: 'linux_gcc_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        id: setup_qt_windows
        with:
          version: '6.8.3'
          target: 'desktop'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Add MSBuild to PATH (Windows)
        uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DQUANTUMVERSE_USE_IMGUI=ON \
            -DQUANTUMVERSE_ENABLE_QUANTUM_GRAVITY=ON \
            -DQUANTUMVERSE_BUILD_TESTS=ON \
            -DQUANTUMVERSE_USE_QT=ON \
            -DCMAKE_PREFIX_PATH="${{ steps.setup_qt_linux.outputs.Qt6_DIR }}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DQUANTUMVERSE_USE_IMGUI=ON `
            -DQUANTUMVERSE_ENABLE_QUANTUM_GRAVITY=ON `
            -DQUANTUMVERSE_BUILD_TESTS=ON `
            -DQUANTUMVERSE_USE_QT=ON `
            -DCMAKE_PREFIX_PATH="${{ steps.setup_qt_windows.outputs.Qt6_DIR }}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Run Tests
        working-directory: build
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            xvfb-run -a ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
          elif [ "${{ runner.os }}" == "Windows" ]; then
            export QT_QPA_PLATFORM=offscreen
            ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
          else
            ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: QuantumVerse-${{ matrix.os }}-${{ env.BUILD_TYPE }}
          path: |
            build/Release/quantumverse_imgui.exe
            build/Release/quantumverse_qml.exe
            build/Testing/**/*
            build/**/*.log
          if-no-files-found: warn

  deploy:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuantumVerse ${{ github.ref_name }}
          body: |
            ## QuantumVerse Simulator ${{ github.ref_name }}
            - Build from commit ${{ github.sha }}
            - Includes Windows and Linux executables
            - All tests passing, static analysis clean
          files: |
            artifacts/QuantumVerse-windows-latest-Release/**/*
            artifacts/QuantumVerse-ubuntu-latest-Release/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}