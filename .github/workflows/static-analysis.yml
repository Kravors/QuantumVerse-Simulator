name: Static Analysis
permissions:
  contents: read
  actions: read
  checks: write


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  clang-format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      
      - name: Check Code Formatting
        run: |
          FORMAT_FILES=""
          if [ -d src ]; then
            FORMAT_FILES="$FORMAT_FILES $(find src -name '*.cpp' -o -name '*.h' ! -path './third_party/*')"
          fi
          if [ -d tests ]; then
            FORMAT_FILES="$FORMAT_FILES $(find tests -name '*.cpp' -o -name '*.h')"
          fi
          if [ -d examples ]; then
            FORMAT_FILES="$FORMAT_FILES $(find examples -name '*.cpp' -o -name '*.h')"
          fi
          if [ -z "$FORMAT_FILES" ]; then
            echo "No source files found to check"
            exit 0
          fi
          clang-format --dry-run --Werror -style=file $FORMAT_FILES
        env:
          CLANG_FORMAT_IGNORE: "third_party"

  clang-tidy:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
      
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
       
      - name: Ensure reports directory exists
        run: mkdir -p reports
      
      - name: Debug - Check working directory and CMakeLists.txt
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in root:"
          ls -la
          echo "Does CMakeLists.txt exist?"
          test -f CMakeLists.txt && echo "YES" || echo "NO"
      
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      
      - name: Run Clang-Tidy
        run: |
          clang-tidy -p build \
            -checks='-*,bugprone-*,performance-*,modernize-*,cppcoreguidelines-*,clang-analyzer-*' \
            -header-filter='.*' \
            $(find src -name '*.cpp' -o -name '*.h') \
            -- -std=c++17
      
      - name: Upload Clang-Tidy Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: clang-tidy-report
          path: |
            reports/
            **/*.txt
            **/*.log

  cppcheck:
    name: Cppcheck Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Ensure reports directory exists
        run: mkdir -p reports
      
      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      
      - name: Run Cppcheck
        run: |
          cppcheck --enable=all --inconclusive \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            src/ 2>&1 | tee cppcheck-report.txt
      
      - name: Upload Cppcheck Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
      
      - name: Build with CodeQL
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
      
      - name: Upload CodeQL Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: codeql-report
          path: |
            **/*.sarif

  coverity:
    name: Coverity Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify Coverity token is configured
        run: |
          if [ -z "${{ secrets.COVERITY_TOKEN }}" ]; then
            echo "::error::COVERITY_TOKEN secret is not configured"
            exit 1
          fi

      - name: Install Coverity
        run: |
          curl -s -f --data-urlencode "token=${{ secrets.COVERITY_TOKEN }}" \
            --data-urlencode "project=QuantumVerse" \
            https://scan.coverity.com/download/linux -o coverity.tar.gz
          tar -xzf coverity.tar.gz
          COVDIR=$(find . -maxdepth 1 -type d -name 'cov-analysis-linux64-*' | head -n 1)
          if [ -z "$COVDIR" ]; then
            echo "::error::Coverity installation directory not found"
            exit 1
          fi
          echo "COVDIR=$COVDIR" >> $GITHUB_ENV
          echo "Added Coverity bin to PATH" >> $GITHUB_STEP_SUMMARY
      
      - name: Build with Coverity
        run: |
          export PATH=$PATH:${{ env.COVDIR }}/bin
          cov-build --dir cov-int cmake -B build
          cov-build --dir cov-int cmake --build build --config Release
      
      - name: Submit to Coverity
        run: |
          cov-submit --dir cov-int --host=https://scan.coverity.com --ssl --token=${{ secrets.COVERITY_TOKEN }} --stream=QuantumVerse

