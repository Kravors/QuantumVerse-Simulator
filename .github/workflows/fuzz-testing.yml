name: Fuzz Testing
permissions:
  contents: read
  actions: read
  checks: write


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Tuesdays at 05:00 UTC
    - cron: '0 5 * * 2'
  workflow_dispatch:

jobs:
  fuzz-metric:
    continue-on-error: true
    name: Metric Tensor Fuzzer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM/Clang for libFuzzer
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - name: Configure CMake with libFuzzer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQUANTUMVERSE_BUILD_TESTS=ON -DQUANTUMVERSE_USE_FUZZER=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address -g"

      - name: Build fuzzer
        run: cmake --build build --parallel 2

      - name: Run metric fuzzer
        run: |
          cd build
          if [ -f ./fuzz_physics_invariants ]; then
            timeout 300 ./fuzz_physics_invariants -max_total_time=300 -detect_leaks=1 || true
          else
            echo "fuzz_physics_invariants not available - skipping"
          fi

      - name: Upload fuzzer crash reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fuzz-crash-reports
          path: |
            build/crash-*
            *.log

  fuzz-geodesic:
