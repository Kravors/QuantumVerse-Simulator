name: Release
permissions:
  contents: read
  actions: read
  checks: write


on:
  push:
    tags: ['v*']

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      id: setup_qt
      with:
        version: '6.8.3'
        target: 'desktop'
        host: 'windows'
        arch: 'win64_msvc2022_64'
        modules: 'qtwebsockets'
        cache: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Set up MSVC dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja
      run: choco install ninja

    - name: Install NSIS
      run: choco install nsis

    - name: Ensure reports directory exists
      run: New-Item -ItemType Directory -Path reports -Force

    - name: Configure CMake
      run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DQUANTUMVERSE_BUILD_TESTS=ON -DQUANTUMVERSE_USE_QT=ON -DCMAKE_PREFIX_PATH="${{ steps.setup_qt.outputs.Qt6_DIR }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Deploy Qt runtime
      run: cmake --build build --config Release --target deploy_qt_runtime

    - name: Install into package tree
      run: cmake --install build --config Release --prefix install

    - name: Package as zip
      run: |
        cd install/bin
        7z a ../../quantumverse_v${{ github.ref_name }}_win64.zip ^
          quantumverse_qml.exe ^
          *.dll *.conf ^
          qt.conf ^
          plugins/ ^
          qml/

    - name: Package as NSIS installer
      run: cpack -B build -G NSIS --config build/CPackConfig.cmake

    - name: Upload zip artifact
      uses: actions/upload-artifact@v5
      with:
        name: quantumverse-windows
        path: quantumverse_v${{ github.ref_name }}_win64.zip

    - name: Upload installer artifact
      uses: actions/upload-artifact@v5
      with:
        name: quantumverse-windows-installer
        path: build/QuantumVerse-*.exe
