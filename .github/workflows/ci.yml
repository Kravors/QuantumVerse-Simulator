name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-smoke:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 MSVC (Windows)
        uses: jurplel/install-qt-action@v4
        id: setup_qt_windows
        with:
          version: '6.8.3'
          target: 'desktop'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Add Qt to PATH
        shell: pwsh
        run: echo "$env:QT_ROOT_DIR\bin" >> $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DQUANTUMVERSE_BUILD_TESTS=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Unit Tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          $EXCLUSIONS = Get-Content -Raw .github/workflows/_canary-exclusions.txt
          ctest --test-dir build -C Release -E "$EXCLUSIONS" --output-on-failure

      - name: QML Lint
        shell: pwsh
        run: |
          $qml = "$env:QT_ROOT_DIR\bin\qml.exe"
          if (-not (Test-Path $qml)) {
            Write-Error "qml.exe not found at: $qml"
            Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
            Get-ChildItem "$env:QT_ROOT_DIR\bin" -ErrorAction SilentlyContinue |
              Select-Object -First 20
            exit 1
          }

          # qml.exe -f runs the file. Window-type QML returns non-zero with
          # "Did not load any objects" — that is NOT a syntax error.
          # Real syntax errors appear as "error:" lines in output.
          $output = & $qml -f src/main.qml 2>&1 | Out-String
          Write-Host $output

          if ($output -match 'error:') {
            Write-Error "QML syntax error detected"
            exit 1
          }

          if (Select-String -Path src/main.qml -Pattern "Placeholder clicked" -Quiet) {
            Write-Error "Placeholder handler found in src/main.qml"
            exit 1
          }

          Write-Host "✓ QML check passed (no syntax errors, no placeholders)"
          exit 0

      - name: UI Contract Check (warn-only until Phase 4)
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/check_ui_contract.py src/main.qml

      - name: Headless Smoke Test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          # Copy Qt DLLs + QML modules (windeployqt)
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            Write-Error "windeployqt.exe not found at: $windeployqt"
            exit 1
          }

          & $windeployqt --release --no-translations --qmldir src `
            build\Release\quantumverse_qml.exe

          # Run headless
          $log = & ".\build\Release\quantumverse_qml.exe" --headless --frames 30 --metric schwarzschild 2>&1 | Out-String
          $log | Out-File evidence\ci\smoke.log -Encoding utf8
          Write-Host $log

          # Verify expected values
          $expected = @{
            'bodies= 9'   = 'physics body count'
            'experiments' = 'experiment registration'
            'instruments' = 'instrument registration'
            'VALIDATOR'   = 'validator checks'
          }
          $failures = @()
          foreach ($key in $expected.Keys) {
            if ($log -notmatch [regex]::Escape($key)) {
              $failures += "Missing: $key ($($expected[$key]))"
            }
          }
          if ($log -notmatch 'all 17 checks passed') {
            $failures += "Missing: 'all 17 checks passed'"
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Config Presence
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/config/simulator.json)) {
            Write-Error "config/simulator.json missing from build output"
            exit 1
          }
          Write-Host "config/simulator.json present"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: ignore
