name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-smoke:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 MSVC (Windows)
        uses: jurplel/install-qt-action@v4
        id: setup_qt_windows
        with:
          version: '6.8.3'
          target: 'desktop'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Add Qt to PATH
        shell: pwsh
        run: echo "$env:QT_ROOT_DIR\bin" >> $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DQUANTUMVERSE_BUILD_TESTS=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Unit Tests
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          # QT_QPA_PLATFORM intentionally NOT set on Windows — Qt 6.8.3 MSVC
          # ships only the 'windows' platform plugin (no 'offscreen').
          # Setting QT_QPA_PLATFORM=offscreen causes immediate failure at
          # plugin initialization (0xC0000005 / "no Qt platform plugin").
          $EXCLUSIONS = Get-Content -Raw .github/workflows/_canary-exclusions.txt
          ctest --test-dir build -C Release -E "$EXCLUSIONS" --output-on-failure

      - name: QML Lint
        shell: pwsh
        run: |
          $qml = "$env:QT_ROOT_DIR\bin\qml.exe"
          if (-not (Test-Path $qml)) {
            Write-Error "qml.exe not found at: $qml"
            Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
            Get-ChildItem "$env:QT_ROOT_DIR\bin" -ErrorAction SilentlyContinue |
              Select-Object -First 20
            exit 1
          }

          # qml.exe -f runs the file. Window-type QML returns non-zero with
          # "Did not load any objects" — that is NOT a syntax error.
          # Real syntax errors appear as "error:" lines in output.
          $output = & $qml -f src/main.qml 2>&1
          $qmlExit = $LASTEXITCODE
          Write-Host "qml.exe exit: $qmlExit (ignored)"
          $output = $output | Out-String
          Write-Host $output

          # Explicitly clear qml.exe exit code before any checks
          $global:LASTEXITCODE = 0

          # Fail only on real syntax errors:
          if ($output -match 'error:') {
            Write-Error "QML syntax error detected"
            exit 1
          }

          if (Select-String -Path src/main.qml -Pattern "Placeholder clicked" -Quiet) {
            Write-Error "Placeholder handler found in src/main.qml"
            exit 1
          }

          Write-Host "✓ QML check passed (no syntax errors, no placeholders)"
          $global:LASTEXITCODE = 0
          exit 0

      - name: UI Contract Check (warn-only until Phase 4)
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/check_ui_contract.py src/main.qml

      - name: Headless Smoke Test — Default (Solar System)
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            Write-Error "windeployqt.exe not found at: $windeployqt"
            exit 1
          }
          & $windeployqt --release --no-translations --qmldir src build\Release\quantumverse_qml.exe

          # 300 frames ensures multiple [REALITY] ticks (~5-20s wall clock depending on backend)
          $log = & ".\build\Release\quantumverse_qml.exe" --headless --frames 300 2>&1 | Out-String
          $log | Out-File evidence\ci\smoke-default.log -Encoding utf8
          Write-Host $log

          if ($log -notmatch 'bodies= 9') {
            Write-Host "DIAGNOSTIC: 'bodies= 9' not found. Searching for related lines:"
            Write-Host "--- Lines with 'bodies': ---"
            ($log -split "`n" | Select-String "bodies") | ForEach-Object { Write-Host $_ }
            Write-Host "--- Lines with 'REALITY': ---"
            ($log -split "`n" | Select-String "REALITY") | ForEach-Object { Write-Host $_ }
            Write-Host "--- Lines with 'VALIDATOR': ---"
            ($log -split "`n" | Select-String "VALIDATOR") | ForEach-Object { Write-Host $_ }
            Write-Error "Default config: expected bodies= 9, not found"
            exit 1
          }
          Write-Host "✓ bodies= 9 confirmed"

          if ($log -notmatch 'all 17 checks passed') {
            Write-Error "Default config: validator did not pass"
            exit 1
          }
          Write-Host "✓ Default config smoke passed"

      - name: Headless Smoke Test — Schwarzschild Metric
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          # Same body count (config-driven, not metric-driven), but Schwarzschild
          # metric path must not crash
          $log = & ".\build\Release\quantumverse_qml.exe" --headless --frames 300 --metric schwarzschild 2>&1 | Out-String
          $log | Out-File evidence\ci\smoke-schwarzschild.log -Encoding utf8
          Write-Host $log

          if ($log -notmatch 'bodies= 9') {
            Write-Host "DIAGNOSTIC: 'bodies= 9' not found. Searching for related lines:"
            Write-Host "--- Lines with 'bodies': ---"
            ($log -split "`n" | Select-String "bodies") | ForEach-Object { Write-Host $_ }
            Write-Host "--- Lines with 'REALITY': ---"
            ($log -split "`n" | Select-String "REALITY") | ForEach-Object { Write-Host $_ }
            Write-Host "--- Lines with 'VALIDATOR': ---"
            ($log -split "`n" | Select-String "VALIDATOR") | ForEach-Object { Write-Host $_ }
            Write-Error "Schwarzschild: expected bodies= 9, not found"
            exit 1
          }
          Write-Host "✓ Schwarzschild metric smoke passed"

      - name: Config Presence
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/config/simulator.json)) {
            Write-Error "config/simulator.json missing from build output"
            exit 1
          }
          Write-Host "config/simulator.json present"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: ignore

      - name: Upload crash dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dump-${{ github.sha }}
          path: |
            **/*.dmp
            evidence/ci/*.log
          if-no-files-found: ignore

      - name: Analyze crash dump with CDB on failure
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          # Find the dump
          $dump = Get-ChildItem -Path build,evidence -Recurse -Filter "*.dmp" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dump) {
            Write-Host "No crash dump found in build/ or evidence/"
            Get-ChildItem -Recurse -Filter "*.dmp" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            exit 0
          }
          Write-Host "Analyzing crash dump: $($dump.FullName)"

          # Find cdb.exe
          $cdbPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
            "C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe"
          )
          $cdb = $null
          foreach ($p in $cdbPaths) {
            if (Test-Path $p) { $cdb = $p; break }
          }
          if (-not $cdb) {
            $cdb = Get-ChildItem "C:\Program Files\WindowsApps\Microsoft.WinDbg_*\amd64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) {
            Write-Host "cdb.exe not found — cannot analyze dump"
            Write-Host "Tip: install Microsoft.WindowsSDK.DebuggingTools or Microsoft.WinDbg"
            exit 0
          }
          Write-Host "Using CDB: $cdb"

          # Run analysis — output to CI log
          & $cdb -z $dump.FullName -c ".symfix; .reload; .ecxr; !analyze -v; k; q" 2>&1 | Tee-Object -FilePath evidence\ci\crash-trace.txt
