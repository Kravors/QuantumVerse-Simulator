name: CI
permissions:
  contents: read
  actions: read
  checks: write


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-and-test-windows:
    # Redundant with build-and-test.yml + ci-cd.yml on push/PR; run only
    # nightly/manual to cut ~485 min/period of duplicate Windows builds.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    strategy:
      matrix:
        build_type: [Release, Debug]
        qt_version: [6.8.3]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      id: setup_qt
      with:
        version: ${{ matrix.qt_version }}
        target: 'desktop'
        host: 'windows'
        arch: 'win64_msvc2022_64'
        modules: 'qtwebsockets'
        cache: true
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DQUANTUMVERSE_BUILD_TESTS=ON -DQUANTUMVERSE_USE_QT=ON -DQUANTUMVERSE_USE_ASAN=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} -DCMAKE_PREFIX_PATH="${{ steps.setup_qt.outputs.Qt6_DIR }}"
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
    - name: Deploy Qt runtime
      run: cmake --build build --config ${{ matrix.build_type }} --target deploy_qt_runtime
    - name: Run tests (excl. slow)
      run: xvfb-run -a ctest -C ${{ matrix.build_type }} -E "PerformanceGateTest|QMLPerformanceBaseline" --output-on-failure
    - name: Run ASan tests (Debug only)
      if: matrix.build_type == 'Debug'
      run: ctest -C Debug -R MemoryLeakTest --output-on-failure

  build-and-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
        qt_version: [6.8.3]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4
      id: setup_qt
      with:
        version: ${{ matrix.qt_version }}
        target: 'desktop'
        host: 'linux'
        arch: 'linux_gcc_64'
        modules: 'qtwebsockets'
        cache: true
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev mesa-utils xvfb
      
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DQUANTUMVERSE_BUILD_TESTS=ON -DQUANTUMVERSE_USE_QT=ON -DCMAKE_PREFIX_PATH="${{ steps.setup_qt.outputs.Qt6_DIR }}"
      
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      
    - name: Run tests (excl. slow)
      run: xvfb-run -a ctest -C ${{ matrix.build_type }} -E "PerformanceGateTest|QMLPerformanceBaseline" --output-on-failure

